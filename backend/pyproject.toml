[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simly"
version = "0.1.0"
description = "Describe a part in plain language, get a verified structural simulation explained like in class."

requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enzo Zanatta" }]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "gmsh>=4.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
simly = "simly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
